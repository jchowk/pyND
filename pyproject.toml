[tool.poetry]
name = "pyND"
version = "0.2.0"
description = "Codes used by the Notre Dame CGM group, focused on absorption line studies."
authors = ["Chris Howk <jhowk@nd.edu>"]
license = "GPL"
readme = "README.md"
homepage = "https://github.com/jchowk/pyND"

[tool.poetry.dependencies]
python = ">=3.9"
astropy = ">=6.1"
numpy = ">=2.0"
scipy = ">=1.13"
linetools = ">=0.3"
matplotlib = ">=3.9"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
